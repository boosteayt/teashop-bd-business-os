name: Manual Build Check

# Intentionally manual: cPanel deploys the buildless React runtime directly.
# This avoids consuming GitHub Actions minutes on every commit.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
